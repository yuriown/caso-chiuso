<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Caso Chiuso! — Mahayana contra o crime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0d0b1a; overflow: hidden; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100%; height: 100dvh; }
      canvas { image-rendering: pixelated; }
      #girar {
        display: none; position: fixed; inset: 0; z-index: 10; background: #0d0b1a; color: #f6d55c;
        font: 700 24px "Pixelify Sans", monospace; text-align: center; padding: 24px;
        flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      }
      #girar span { font-size: 64px; animation: girar 1.6s ease-in-out infinite; }
      @keyframes girar { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
      /* celular em pe: o labirinto ficaria minusculo */
      @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="girar"><span>📱</span>Gire o celular para jogar na horizontal</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
